<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Customer Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4">Customer Details</h2>

        <form>

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" placeholder="Enter your name" required>
            </div>

            <!-- Mobile -->
            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" placeholder="Enter your mobile number" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <!-- Number of Guests -->
            <div class="mb-3">
                <label class="form-label">Number of Guests</label>
                <input type="number" class="form-control" min="1" placeholder="Enter number of guests" required>
            </div>

            <!-- Date -->
            <div class="mb-3">
                <label class="form-label">Reservation Date</label>
                <input type="date" class="form-control" required>
            </div>

            <!-- Time -->
            <div class="mb-3">
                <label class="form-label">Reservation Time</label>
                <input type="time" class="form-control" required>
            </div>

            <!-- Table Type -->
            <div class="mb-3">
                <label class="form-label">Table Preference</label>
                <select class="form-select">
                    <option selected disabled>Select Table</option>
                    <option>Indoor</option>
                    <option>Outdoor</option>
                    <option>Window Side</option>
                    <option>Family Table</option>
                </select>
            </div>

            <!-- Special Request -->
            <div class="mb-3">
                <label class="form-label">Special Requests</label>
                <textarea class="form-control" rows="3" placeholder="Birthday decoration, baby chair, etc."></textarea>
            </div>

            <!-- Submit -->
            <div class="text-center">
                <button class="btn btn-success px-4">Reserve Table</button>
                <button type="reset" class="btn btn-secondary px-4">Reset</button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
