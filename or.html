<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose Service</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f8f9fa;
}

.card{
    transition:0.3s;
    border:none;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.card img{
    height:250px;
    object-fit:cover;
}

.btn{
    width:100%;
}
</style>

</head>
<body>

<div class="container py-5">

<h2 class="text-center mb-5">
🍽️ Royal Spice Restaurant
</h2>

<div class="row g-4">

    <!-- Order Food Card -->
    <div class="col-md-6">

        <div class="card shadow">

            <img src="o1.webp" class="card-img-top">

            <div class="card-body text-center">

                <h3>🍔 Order Food Online</h3>

                <p>
                    Order your favourite dishes and get them delivered to your doorstep.
                </p>

                <a href="or1.html" class="btn btn-success">
                    Order Now
                </a>

            </div>

        </div>

    </div>

    <!-- Reservation Card -->
    <div class="col-md-6">

        <div class="card shadow">

            <img src="r1.webp" class="card-img-top">

            <div class="card-body text-center">

                <h3>🍽️ Reserve a Table</h3>

                <p>
                    Book your table in advance and enjoy a hassle-free dining experience.
                </p>

                <a href="cp.html" class="btn btn-primary">
                    Reserve Now
                </a>

            </div>

        </div>

    </div>

</div>

</div>

</body>
</html>
